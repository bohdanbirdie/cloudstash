# Standalone Cargo workspace: the native app keeps its dependencies, lockfile,
# and build output (apps/native/target) to itself.
[workspace]

[package]
name = "cloudstash-native"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
publish = false

[package.metadata.cloudstash]
# The oldest version that may still run. Releases put it in their feed, and older apps show the
# must-update screen (src/update.rs). Raise it with the version when older apps would break.
minimum-version = "0.1.0"

[dependencies]
base64 = "0.22"
# Checks updates' signatures (src/update.rs).
ed25519-dalek = { version = "2", features = ["std"] }
# Watches the sync connection's pages (src/livestore/library.rs).
futures = "0.3"
getrandom = "0.2"
# Decodes and shrinks the link cards' pictures and the resize cursor (rune uses the same crate).
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "ico",
  "webp",
  "tiff",
] }
# Downloads the link cards' pictures (src/images).
reqwest = { version = "0.13", default-features = false, features = [
  "native-tls",
  "http2",
] }
keyring = { version = "3", features = ["apple-native"] }
# LiveStore's Rust client (livestore-contrib, experimental): pinned to a commit.
livestore = { git = "https://github.com/livestorejs/livestore-contrib", rev = "dc0aa0d079fe195cf20802b7cd1ff5982f20b102" }
livestore-schema = { git = "https://github.com/livestorejs/livestore-contrib", rev = "dc0aa0d079fe195cf20802b7cd1ff5982f20b102" }
livestore-sqlite = { git = "https://github.com/livestorejs/livestore-contrib", rev = "dc0aa0d079fe195cf20802b7cd1ff5982f20b102" }
livestore-sync = { git = "https://github.com/livestorejs/livestore-contrib", rev = "dc0aa0d079fe195cf20802b7cd1ff5982f20b102" }
livestore-sync-cf = { git = "https://github.com/livestorejs/livestore-contrib", rev = "dc0aa0d079fe195cf20802b7cd1ff5982f20b102" }
# rune is pre-release: pinned to a commit.
rune = { git = "https://github.com/anomalyco/rune", rev = "c0f6d48d67726d8c78e0f5c8367b3c16a5bdad37" }
# rune's component kit, for the shell prototype's resizable, collapsible sidebar (SplitView).
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "c0f6d48d67726d8c78e0f5c8367b3c16a5bdad37" }
# Has AppKit remember the window's position and size (src/ui_state.rs).
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "c0f6d48d67726d8c78e0f5c8367b3c16a5bdad37" }
# Compares the app's version with the newest release's (src/update.rs).
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.47", features = [
  "rt-multi-thread",
  "time",
  "sync",
  "macros",
] }
# The sync client's WebSocket has no TLS of its own; this turns it on for wss://.
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
ureq = { version = "2", features = ["json"] }
url = "2"
nucleo-matcher = "0.3.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "registry",
  "std",
] }

# rune vendors patched crates; a dependency's [patch] does not reach us, so repeat it.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "c0f6d48d67726d8c78e0f5c8367b3c16a5bdad37" }
naga = { git = "https://github.com/anomalyco/rune", rev = "c0f6d48d67726d8c78e0f5c8367b3c16a5bdad37" }
winit = { git = "https://github.com/anomalyco/rune", rev = "c0f6d48d67726d8c78e0f5c8367b3c16a5bdad37" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "c0f6d48d67726d8c78e0f5c8367b3c16a5bdad37" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "c0f6d48d67726d8c78e0f5c8367b3c16a5bdad37" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "c0f6d48d67726d8c78e0f5c8367b3c16a5bdad37" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "c0f6d48d67726d8c78e0f5c8367b3c16a5bdad37" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "c0f6d48d67726d8c78e0f5c8367b3c16a5bdad37" }

# The shell prototype's trackpad taps and left-only resize cursor (src/shell_kit/mac.rs), and the
# theme (src/appearance.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSBitmapImageRep",
  "NSCursor",
  "NSDirection",
  "NSHapticFeedback",
  "NSImage",
  "NSImageRep",
  "NSAppearance",
  "NSApplication",
  "NSResponder",
] }
# The menu bar icon (src/menu_bar.rs); rune has none.
tray-icon = { version = "0.26", default-features = false }
# The theme (src/appearance.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
] }
# Open at login (src/login_item.rs): SMAppService, without unsafe code of ours.
smappservice-rs = "0.1"

# Keep target/ small: no debug info for dependencies, line tables only for the app.
[profile.dev]
debug = "line-tables-only"

# Optimised dependencies: unoptimised, Rune scrolls the card grid slowly and the image decoders
# take seconds per picture.
[profile.dev.package."*"]
debug = false
opt-level = 2

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
# The contract test (src/livestore/contract.rs) replays events into an in-memory database.
livestore-core = { git = "https://github.com/livestorejs/livestore-contrib", rev = "dc0aa0d079fe195cf20802b7cd1ff5982f20b102" }
