name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Plan only, or deploy
        type: choice
        options: [plan, deploy]
        default: plan

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: prod
      environment: production
      action: ${{ inputs.action || 'deploy' }}
    secrets: inherit
