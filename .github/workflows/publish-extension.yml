name: Publish Extension

on:
  workflow_dispatch:

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun --cwd apps/extension run postinstall

      - name: Build and zip
        working-directory: apps/extension
        run: bun run zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudstash-extension-${{ github.sha }}
          path: apps/extension/.output/*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true

      - name: Submit to Chrome Web Store
        working-directory: apps/extension
        run: |
          ZIP=$(ls .output/*-chrome.zip | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::No *-chrome.zip found in .output/"
            exit 1
          fi
          echo "Submitting $ZIP"
          bunx wxt submit --chrome-api-version v2 --chrome-zip "$ZIP"
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
