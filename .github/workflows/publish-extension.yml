name: Publish Extension

on:
  workflow_dispatch:

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # TEMP(2026-08-10): apps/extension is build-broken on the effect-v4 tree —
      # it imports the v4-migrated src/livestore/schema.ts via the @web alias while
      # pinned to effect v3. Remove this guard in the extension fast-follow PR
      # (see docs/todos/effect-v4-migration-progress.md, final-review F1/F2).
      - name: Guard — extension not yet migrated to effect v4
        run: |
          echo "::error::Publishing is blocked: apps/extension is broken until its effect-v4 migration lands (fast-follow PR). Remove this guard there."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun --cwd apps/extension run postinstall

      - name: Build and zip
        working-directory: apps/extension
        run: bun run zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudstash-extension-${{ github.sha }}
          path: apps/extension/.output/*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true

      - name: Submit to Chrome Web Store
        working-directory: apps/extension
        run: |
          ZIP=$(ls .output/*-chrome.zip | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::No *-chrome.zip found in .output/"
            exit 1
          fi
          echo "Submitting $ZIP"
          bunx wxt submit --chrome-zip "$ZIP"
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
