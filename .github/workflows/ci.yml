name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: "25"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run check

  unit-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@v7
        with:
          node-version: "25"
          cache: pnpm
          cache-dependency-path: vendor/livestore/pnpm-lock.yaml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: pnpm install --frozen-lockfile
        working-directory: vendor/livestore

      - run: bun run typecheck

      - run: bun run test:unit

  worker-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@v7
        with:
          node-version: "25"
          cache: pnpm
          cache-dependency-path: vendor/livestore/pnpm-lock.yaml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: pnpm install --frozen-lockfile
        working-directory: vendor/livestore

      - run: bun run test:e2e
        env:
          BETTER_AUTH_SECRET: test-secret-for-ci-only-32chars
          BETTER_AUTH_URL: http://localhost:3000
          ENABLE_TEST_AUTH: "true"

  extension-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@v7
        with:
          node-version: "25"
          cache: pnpm
          cache-dependency-path: vendor/livestore/pnpm-lock.yaml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: pnpm install --frozen-lockfile
        working-directory: vendor/livestore

      # Extension app (apps/extension) — own tsconfig + bun:test runner.
      # wxt prepare generates .wxt/ types that apps/extension/tsconfig extends.
      - run: bun run --cwd apps/extension postinstall

      - run: bun run --cwd apps/extension compile

      - run: bun run test:ext

      - run: bun run build

      - run: bun run test:bundle
