[install]
minimumReleaseAge = 604800
# @livestore snapshot pins are first-party (same SHA as the vendor/livestore
# submodule) and always freshly published — the age gate can never pass them.
# The shadcn CLI and its icon library are exact-pinned and deliberately kept
# current, so intentional upgrades can precede the general package age gate.
minimumReleaseAgeExcludes = [
  "@livestore/adapter-cloudflare",
  "@livestore/adapter-web",
  "@livestore/devtools-vite",
  "@livestore/livestore",
  "@livestore/peer-deps",
  "@livestore/react",
  "@livestore/sync-cf",
  "@livestore/wa-sqlite",
  "lucide-react",
  "shadcn",
]
